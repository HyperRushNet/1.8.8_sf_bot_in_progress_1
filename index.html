<!doctype html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <script>
        (function () {
            "use strict";
            const urlParams = new URLSearchParams(window.location.search);
            window.QUALITY = parseFloat(urlParams.get("q")) || 0.8;
            try {
                Object.defineProperty(window, "devicePixelRatio", {
                    get: function () { return window.QUALITY; },
                    set: function () {},
                    configurable: false,
                });
                if (window.screen) {
                    Object.defineProperty(window.screen, "devicePixelRatio", {
                        get: function () { return window.QUALITY; },
                        configurable: false,
                    });
                }
            } catch (e) {}
            var origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attrs) {
                if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
                    attrs = attrs || {};
                    attrs.powerPreference = "high-performance";
                    return origGetContext.call(this, type, attrs);
                }
                return origGetContext.call(this, type, attrs);
            };
            var isTabVisible = !document.hidden;
            document.addEventListener("visibilitychange", () => isTabVisible = !document.hidden, true);
            var origRAF = window.requestAnimationFrame;
            window.requestAnimationFrame = function (callback) {
                return origRAF(function (timestamp) {
                    if (!isTabVisible) return;
                    callback(timestamp);
                });
            };
            ["contextmenu", "dragstart", "selectstart", "gesturestart", "gesturechange", "gestureend"]
                .forEach(evt => document.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, true));
        })();
    </script>

    <style>

        }

        }

    <!-- ORIGINELE CLIENT SCRIPT (volledig intact) -->
    <script>
        "use strict";
        (function () {
            window.updateProgress = function (percent) {
                const rounded = Math.min(Math.round(percent || 0), 100);
                const bar = document.getElementById("progress-bar");
                const text = document.getElementById("progress-text");
                if (bar) bar.style.width = rounded + "%";
                if (text) text.textContent = rounded + "%";
            };

            function showErrorPopup(msg) {
                const popup = document.getElementById("error-popup");
                if (msg) document.getElementById("error-message").textContent = msg;
                popup.style.display = "block";
            }

            function hideLoadingScreen() {
                const loader = document.getElementById("loading-container");
                if (loader) loader.style.display = "none";
            }

            window.addEventListener("load", async () => {
                if ("serviceWorker" in navigator) {
                    try { await navigator.serviceWorker.register("sw.js"); } catch (err) {}
                }

                try {
                    const epk = await loadCachedAssetUI("./game-assets/meta.json", true, "1.8.8-wasm")
                        .catch(async () => await loadCachedAssetUI("./game-assets/meta.json", true, "1.8.8-wasm"));

                    const listResponse = await fetch("list.json");
                    const listData = await listResponse.json();

                    const params = {
                        demoMode: false,
                        localesURI: "lang/",
                        container: "game_frame",
                        assetsURI: epk,
                        worldsDB: "worlds",
                        ...listData,
                    };

                    parseParams(params);
                    window.eaglercraftXOpts = params;

                    await new Promise(res => {
                        if (window["wispcraft-ServerReady"]) window["wispcraft-ServerReady"].then(res);
                        else setTimeout(res, 800);
                    });

                    hideLoadingScreen();
                    main();

                    setTimeout(() => {
                        if (window.__eaglercraftXBlobURLs) {
                            window.__eaglercraftXBlobURLs.forEach(url => {
                                try { URL.revokeObjectURL(url); } catch (e) {}
                            });
                            window.__eaglercraftXBlobURLs.length = 0;
                        }
                    }, 15000);
                } catch (err) {
                    console.error("Boot Error:", err);
                    showErrorPopup("Could not load game assets. Try again or check your internet.");
                }
            });
        })();
    </script>

    <!-- BCLIENT SCRIPT -->
    <script>
        (function() {
            "use strict";

            // DOM refs
            const statusBar = document.getElementById('status-bar');
            const logConsole = document.getElementById('log-console');
            const popupContainer = document.getElementById('popup-container');
            const popupTitle = document.getElementById('popup-title');
            const popupDesc = document.getElementById('popup-desc');
            const dotsContainer = document.getElementById('dots-container');
            const popupSelect = document.getElementById('popup-select');
            const popupSkip = document.getElementById('popup-skip');
            const popupCancel = document.getElementById('popup-cancel');
            const toggleBtn = document.getElementById('toggle-ui-btn');
            const startBotBtn = document.getElementById('start-bot-btn');
            const stopBotBtn = document.getElementById('stop-bot-btn');
            const passInput = document.getElementById('pass-input');
            const overlay = document.getElementById('bclient-overlay');
            const startSelectieBtn = document.getElementById('start-selectie-btn');

            const markerGreen = document.getElementById('marker-green');
            const markerOrange = document.getElementById('marker-orange');
            const markerRed = document.getElementById('marker-red');
            const markerPurple = document.getElementById('marker-purple');

            let selectionState = {
                step: 0,
                serverListPos: null,
                disconnectAreaPos: null,
                disconnectBtnPos: null,
                survivalItemPos: null,
                completed: false
            };

            let isSelecting = false;
            let waitingForClick = false;
            let currentStep = 0;
            let botRunning = false;
            let botStopRequested = false;

            function log(msg) {
                const time = new Date().toLocaleTimeString();
                const div = document.createElement('div');
                div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
                logConsole.prepend(div);
                if (logConsole.children.length > 80) logConsole.lastChild.remove();
            }

            function setStatus(text) {
                const span = statusBar.querySelector('span');
                if (span) span.textContent = text;
            }

            function hideAllMarkers() {
                ['marker-green','marker-orange','marker-red','marker-purple'].forEach(id => {
                    document.getElementById(id).style.display = 'none';
                });
            }

            function showPopup(step) {
                currentStep = step;
                const total = 4;
                dotsContainer.innerHTML = '';
                for (let i = 1; i <= total; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'dot';
                    if (i < step) dot.classList.add('done');
                    else if (i === step) dot.classList.add('active');
                    dotsContainer.appendChild(dot);
                }
                const labels = [
                    'Selecteer Server List',
                    'Selecteer Disconnect Area',
                    'Selecteer Disconnect knop',
                    'Selecteer Survival Item'
                ];
                popupTitle.textContent = `Stap ${step}/${total}`;
                popupDesc.textContent = labels[step-1] || '';
                popupContainer.classList.add('visible');
                isSelecting = true;
                waitingForClick = false;
                overlay.classList.add('active');
                setStatus(`Stap ${step}/4: ${labels[step-1]}`);
            }

            function hidePopup() {
                popupContainer.classList.remove('visible');
                isSelecting = false;
                overlay.classList.remove('active');
            }

            function startSelection() {
                hideAllMarkers();
                selectionState = { step:0, serverListPos:null, disconnectAreaPos:null, disconnectBtnPos:null, survivalItemPos:null, completed:false };
                startBotBtn.disabled = true;
                log('📋 Selectie gestart');
                showPopup(1);
            }

            function skipStep(step) {
                const defaultPos = { x: 45, y: 45 };
                const defaultDot = { x: 50, y: 50 };
                switch(step) {
                    case 1: selectionState.serverListPos = { ...defaultPos }; break;
                    case 2: selectionState.disconnectAreaPos = { ...defaultPos }; break;
                    case 3: selectionState.disconnectBtnPos = { ...defaultDot }; break;
                    case 4: selectionState.survivalItemPos = { ...defaultDot }; break;
                }
                log(`Stap ${step} overgeslagen (default positie)`);
                advanceAfterStep(step);
            }

            function advanceAfterStep(step) {
                if (step === 4) {
                    selectionState.completed = true;
                    hidePopup();
                    setStatus('✅ Selectie compleet! Start de bot.');
                    startBotBtn.disabled = false;
                    log('✅ Selectie compleet!');
                    return;
                }
                const next = step + 1;
                showPopup(next);
            }

            function handleCanvasClick(e) {
                if (!waitingForClick) return;
                const rect = overlay.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                const step = currentStep;

                switch(step) {
                    case 1:
                        selectionState.serverListPos = { x, y };
                        markerGreen.style.left = x + '%';
                        markerGreen.style.top = y + '%';
                        markerGreen.style.width = '6%';
                        markerGreen.style.height = '4%';
                        markerGreen.style.display = 'block';
                        markerGreen.style.transform = 'translate(-50%, -50%)';
                        log(`📌 Server List op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 2:
                        selectionState.disconnectAreaPos = { x, y };
                        markerOrange.style.left = x + '%';
                        markerOrange.style.top = y + '%';
                        markerOrange.style.display = 'block';
                        log(`📌 Disconnect Area op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 3:
                        selectionState.disconnectBtnPos = { x, y };
                        markerRed.style.left = x + '%';
                        markerRed.style.top = y + '%';
                        markerRed.style.display = 'block';
                        log(`📌 Disconnect knop op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 4:
                        selectionState.survivalItemPos = { x, y };
                        markerPurple.style.left = x + '%';
                        markerPurple.style.top = y + '%';
                        markerPurple.style.display = 'block';
                        log(`📌 Survival Item op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                }
                waitingForClick = false;
                hidePopup();
                setStatus(`✅ Stap ${step} vastgelegd`);
                setTimeout(() => {
                    if (!isSelecting && !waitingForClick) {
                        advanceAfterStep(step);
                    }
                }, 300);
            }

            // Event listeners
            startSelectieBtn.addEventListener('click', startSelection);

            popupSelect.addEventListener('click', () => {
                if (!isSelecting) return;
                hidePopup();
                waitingForClick = true;
                setStatus(`👆 Klik op het scherm (stap ${currentStep})`);
                overlay.classList.add('active');
            });

            popupSkip.addEventListener('click', () => {
                if (!isSelecting) return;
                skipStep(currentStep);
            });

            popupCancel.addEventListener('click', () => {
                if (!isSelecting) return;
                hidePopup();
                waitingForClick = false;
                setStatus('❌ Selectie geannuleerd');
                hideAllMarkers();
                overlay.classList.remove('active');
                startBotBtn.disabled = true;
                log('❌ Selectie geannuleerd');
            });

            overlay.addEventListener('click', handleCanvasClick);
            overlay.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if (!touch) return;
                const me = new MouseEvent('click', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                });
                handleCanvasClick(me);
            }, { passive: true });

            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('ui-hidden');
            });

            // ---- BOT LOGIC ----
            function dispatchMouseEvent(type, x, y, button=0) {
                const el = document.elementFromPoint(x, y) || overlay;
                const ev = new MouseEvent(type, {
                    clientX: x, clientY: y,
                    button: button,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                el.dispatchEvent(ev);
            }

            function dispatchKeyEvent(type, key, code='') {
                const ev = new KeyboardEvent(type, {
                    key: key,
                    code: code || key,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                document.dispatchEvent(ev);
            }

            // Type een string karakter voor karakter zoals een echte speler
            async function typeString(text, delayBetween=50) {
                for (const char of text) {
                    if (botStopRequested) break;
                    // Voor speciale karakters zoals '/' gebruiken we de juiste code
                    let code = 'Key' + char.toUpperCase();
                    if (char === '/') code = 'Slash';
                    else if (char === ' ') code = 'Space';
                    else if (char === '.') code = 'Period';
                    else if (char === '@') code = 'Digit2'; // Shift+2
                    else if (char === '#') code = 'Digit3'; // Shift+3
                    else if (char === '!') code = 'Digit1'; // Shift+1
                    else if (char === '?') code = 'Slash'; // Shift+/
                    
                    dispatchKeyEvent('keydown', char, code);
                    dispatchKeyEvent('keyup', char, code);
                    await sleep(delayBetween);
                }
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            function getPos(sel) {
                if (!sel) return null;
                const rect = overlay.getBoundingClientRect();
                return {
                    x: rect.left + (sel.x / 100) * rect.width,
                    y: rect.top + (sel.y / 100) * rect.height
                };
            }

            function pixelMatch(area, threshold) {
                // Simulatie: 80% kans op match voor demo
                return Math.random() > 0.2;
            }

            async function botLoop() {
                if (botRunning) return;
                botRunning = true;
                botStopRequested = false;
                stopBotBtn.style.display = 'inline-block';
                startBotBtn.disabled = true;
                log('🤖 Bot gestart');

                while (!botStopRequested) {
                    try {
                        // 1. Dubbelklik op server list
                        const sl = selectionState.serverListPos;
                        if (sl) {
                            const pos = getPos(sl);
                            if (pos) {
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                                await sleep(100);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                                log('📡 Dubbelklik op server list');
                            }
                        }
                        await sleep(5000);

                        // 2. T indrukken (chat openen)
                        dispatchKeyEvent('keydown', 't', 'KeyT');
                        dispatchKeyEvent('keyup', 't', 'KeyT');
                        log('⌨️ T ingedrukt (chat openen)');
                        await sleep(1000);

                        // 3. Type /login <pass> zoals een echte speler
                        const pass = passInput.value || '<pass>';
                        const cmd = '/login ' + pass;
                        log(`⌨️ Typen: ${cmd}`);
                        await typeString(cmd, 30); // 30ms tussen elke toets
                        log(`✅ ${cmd} getypt`);
                        await sleep(500);

                        // 4. Enter
                        dispatchKeyEvent('keydown', 'Enter', 'Enter');
                        dispatchKeyEvent('keyup', 'Enter', 'Enter');
                        log('⏎ Enter (verstuur commando)');
                        await sleep(30000 + Math.floor(Math.random() * 5000));

                        // 5. Rechtsklik op survival item
                        const si = selectionState.survivalItemPos;
                        if (si) {
                            const pos = getPos(si);
                            if (pos) {
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 2);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 2);
                                log('🖱️ Rechtsklik op survival item');
                            }
                        }
                        await sleep(5000);

                        // 6. Wacht 10-15 min
                        const waitTime = 600000 + Math.floor(Math.random() * 300000);
                        log(`⏳ Wacht ${(waitTime/60000).toFixed(1)} min`);
                        await sleep(waitTime);

                        // 7. Escape
                        dispatchKeyEvent('keydown', 'Escape', 'Escape');
                        dispatchKeyEvent('keyup', 'Escape', 'Escape');
                        log('⎋ Escape');
                        await sleep(3000);

                        // 8. Klik disconnect
                        const db = selectionState.disconnectBtnPos;
                        if (db) {
                            const pos = getPos(db);
                            if (pos) {
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                                log('🔴 Klik disconnect');
                            }
                        }
                        await sleep(3000);

                        // 9. Check disconnect area
                        const area = selectionState.disconnectAreaPos;
                        let visible = false;
                        if (area) {
                            visible = pixelMatch(area, 0.7);
                        }
                        if (visible) {
                            log('🔄 Disconnect nog zichtbaar, nogmaals klik');
                            if (db) {
                                const pos = getPos(db);
                                if (pos) {
                                    dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                    dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                                }
                            }
                            await sleep(3000);
                        } else {
                            log('✅ Disconnect niet zichtbaar, ga door');
                        }
                        await sleep(3000);

                        if (botStopRequested) break;
                    } catch (err) {
                        log('❌ Fout in bot loop: ' + err.message);
                        await sleep(5000);
                    }
                }

                botRunning = false;
                stopBotBtn.style.display = 'none';
                startBotBtn.disabled = false;
                log('⏹ Bot gestopt');
            }

            startBotBtn.addEventListener('click', () => {
                if (!selectionState.completed) {
                    log('⚠️ Selecteer eerst alle stappen');
                    return;
                }
                if (botRunning) return;
                botLoop();
            });

            stopBotBtn.addEventListener('click', () => {
                botStopRequested = true;
                log('⏳ Stop aangevraagd...');
            });

            log('🟢 BClient geladen');
            setStatus('🔹 Klik op "Start Selectie" om te beginnen');
        })();
    </script>

</body>
</html>

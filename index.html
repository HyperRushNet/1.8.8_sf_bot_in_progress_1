    <script>
        (function () {
            "use strict";
            const urlParams = new URLSearchParams(window.location.search);
            window.QUALITY = parseFloat(urlParams.get("q")) || 0.8;
            try {
                Object.defineProperty(window, "devicePixelRatio", {
                    get: function () { return window.QUALITY; },
                    set: function () {},
                    configurable: false,
                });
                if (window.screen) {
                    Object.defineProperty(window.screen, "devicePixelRatio", {
                        get: function () { return window.QUALITY; },
                        configurable: false,
                    });
                }
            } catch (e) {}
            var origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attrs) {
                if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
                    attrs = attrs || {};
                    attrs.powerPreference = "high-performance";
                    return origGetContext.call(this, type, attrs);
                }
                return origGetContext.call(this, type, attrs);
            };
            var isTabVisible = !document.hidden;
            document.addEventListener("visibilitychange", () => isTabVisible = !document.hidden, true);
            var origRAF = window.requestAnimationFrame;
            window.requestAnimationFrame = function (callback) {
                return origRAF(function (timestamp) {
                    if (!isTabVisible) return;
                    callback(timestamp);
                });
            };
            ["contextmenu", "dragstart", "selectstart", "gesturestart", "gesturechange", "gestureend"]
                .forEach(evt => document.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, true));
        })();
    </script>

    <!-- ORIGINELE CLIENT SCRIPT -->
    <script>
        "use strict";
        (function () {
            window.updateProgress = function (percent) {
                const rounded = Math.min(Math.round(percent || 0), 100);
                const bar = document.getElementById("progress-bar");
                const text = document.getElementById("progress-text");
                if (bar) bar.style.width = rounded + "%";
                if (text) text.textContent = rounded + "%";
            };

            function showErrorPopup(msg) {
                const popup = document.getElementById("error-popup");
                if (msg) document.getElementById("error-message").textContent = msg;
                popup.style.display = "block";
            }

            function hideLoadingScreen() {
                const loader = document.getElementById("loading-container");
                if (loader) loader.style.display = "none";
            }

            window.addEventListener("load", async () => {
                if ("serviceWorker" in navigator) {
                    try { await navigator.serviceWorker.register("sw.js"); } catch (err) {}
                }

                try {
                    const epk = await loadCachedAssetUI("./game-assets/meta.json", true, "1.8.8-wasm")
                        .catch(async () => await loadCachedAssetUI("./game-assets/meta.json", true, "1.8.8-wasm"));

                    const listResponse = await fetch("list.json");
                    const listData = await listResponse.json();

                    const params = {
                        demoMode: false,
                        localesURI: "lang/",
                        container: "game_frame",
                        assetsURI: epk,
                        worldsDB: "worlds",
                        ...listData,
                    };

                    parseParams(params);
                    window.eaglercraftXOpts = params;

                    await new Promise(res => {
                        if (window["wispcraft-ServerReady"]) window["wispcraft-ServerReady"].then(res);
                        else setTimeout(res, 800);
                    });

                    hideLoadingScreen();
                    main();

                    setTimeout(() => {
                        if (window.__eaglercraftXBlobURLs) {
                            window.__eaglercraftXBlobURLs.forEach(url => {
                                try { URL.revokeObjectURL(url); } catch (e) {}
                            });
                            window.__eaglercraftXBlobURLs.length = 0;
                        }
                    }, 15000);
                } catch (err) {
                    console.error("Boot Error:", err);
                    showErrorPopup("Could not load game assets. Try again or check your internet.");
                }
            });
        })();
    </script>

            // MINIMUM CONFIDENCE VOOR OCR (50%)
            const MIN_CONFIDENCE = 50;

            // Flag om te weten of we een reset hebben gedaan

            // LOG functies
            function log(msg, type = '') {
                const time = new Date().toLocaleTimeString();
                const div = document.createElement('div');
                const cls = type ? `log-${type}` : '';
                div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
                logConsole.prepend(div);
                if (logConsole.children.length > 150) logConsole.lastChild.remove();
                console.log(`[${time}] ${msg}`);
            }

            function logDebug(msg) { log('🔍 ' + msg, 'debug'); }
            function logOCR(msg) { log('📖 ' + msg, 'ocr'); }
            function logSuccess(msg) { log('✅ ' + msg, 'success'); }
            function logError(msg) { log('❌ ' + msg, 'error'); }
            function logStep(msg) { log('📍 ' + msg, 'step'); }
            function logFarming(msg) { log('⏳ ' + msg, 'farming'); }
            function logReset(msg) { log('🔄 ' + msg, 'reset'); }

            function setStatus(text) {
                const span = statusBar.querySelector('span');
                if (span) span.textContent = text;
            }

            function hideAllMarkers() {
                ['marker-green','marker-orange','marker-red','marker-purple'].forEach(id => {
                    document.getElementById(id).style.display = 'none';
                });
            }

            function showPopup(step) {
                currentStep = step;
                const total = 4;
                dotsContainer.innerHTML = '';
                for (let i = 1; i <= total; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'dot';
                    if (i < step) dot.classList.add('done');
                    else if (i === step) dot.classList.add('active');
                    dotsContainer.appendChild(dot);
                }
                const labels = [
                    'Selecteer Server List',
                    'Selecteer Back to Server List knop',
                    'Selecteer Disconnect knop',
                    'Selecteer Survival Item'
                ];
                popupTitle.textContent = `Stap ${step}/${total}`;
                popupDesc.textContent = labels[step-1] || '';
                popupContainer.classList.add('visible');
                isSelecting = true;
                waitingForClick = false;
                overlay.classList.add('active');
                setStatus(`Stap ${step}/${total}: ${labels[step-1]}`);
            }

            function hidePopup() {
                popupContainer.classList.remove('visible');
                isSelecting = false;
                overlay.classList.remove('active');
            }

            function startSelection() {
                hideAllMarkers();
                selectionState = { step:0, serverListPos:null, backToServerListPos:null, disconnectBtnPos:null, survivalItemPos:null, completed:false };
                startBotBtn.disabled = true;
                log('📋 Selectie gestart');
                showPopup(1);
            }

            function skipStep(step) {
                const defaultPos = { x: 45, y: 45 };
                const defaultDot = { x: 50, y: 50 };
                switch(step) {
                    case 1: 
                        selectionState.serverListPos = { ...defaultPos }; 
                        markerGreen.style.left = '45%';
                        markerGreen.style.top = '45%';
                        markerGreen.style.display = 'block';
                        break;
                    case 2: 
                        selectionState.backToServerListPos = { ...defaultDot };
                        markerOrange.style.left = '50%';
                        markerOrange.style.top = '50%';
                        markerOrange.style.display = 'block';
                        break;
                    case 3: 
                        selectionState.disconnectBtnPos = { ...defaultDot };
                        markerRed.style.left = '50%';
                        markerRed.style.top = '50%';
                        markerRed.style.display = 'block';
                        break;
                    case 4: 
                        selectionState.survivalItemPos = { ...defaultDot };
                        markerPurple.style.left = '50%';
                        markerPurple.style.top = '50%';
                        markerPurple.style.display = 'block';
                        break;
                }
                log(`Stap ${step} overgeslagen (default positie)`);
                advanceAfterStep(step);
            }

            function advanceAfterStep(step) {
                if (step === 4) {
                    selectionState.completed = true;
                    hidePopup();
                    setStatus('✅ Selectie compleet! Start de bot.');
                    startBotBtn.disabled = false;
                    logSuccess('Selectie compleet!');
                    return;
                }
                const next = step + 1;
                showPopup(next);
            }

            function handleCanvasClick(e) {
                if (!waitingForClick) return;
                const rect = overlay.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                const step = currentStep;

                switch(step) {
                    case 1:
                        selectionState.serverListPos = { x, y };
                        markerGreen.style.left = x + '%';
                        markerGreen.style.top = y + '%';
                        markerGreen.style.display = 'block';
                        log(`📌 Server List op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 2:
                        selectionState.backToServerListPos = { x, y };
                        markerOrange.style.left = x + '%';
                        markerOrange.style.top = y + '%';
                        markerOrange.style.display = 'block';
                        log(`📌 Back to Server List op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 3:
                        selectionState.disconnectBtnPos = { x, y };
                        markerRed.style.left = x + '%';
                        markerRed.style.top = y + '%';
                        markerRed.style.display = 'block';
                        log(`📌 Disconnect knop op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                    case 4:
                        selectionState.survivalItemPos = { x, y };
                        markerPurple.style.left = x + '%';
                        markerPurple.style.top = y + '%';
                        markerPurple.style.display = 'block';
                        log(`📌 Survival Item op (${x.toFixed(1)}%, ${y.toFixed(1)}%)`);
                        break;
                }
                waitingForClick = false;
                hidePopup();
                setStatus(`✅ Stap ${step} vastgelegd (sleepbaar)`);
                checkCompletion();
                setTimeout(() => {
                    if (!isSelecting && !waitingForClick) {
                        advanceAfterStep(step);
                    }
                }, 300);
            }

            function checkCompletion() {
                if (selectionState.serverListPos && selectionState.backToServerListPos &&
                    selectionState.disconnectBtnPos && selectionState.survivalItemPos) {
                    selectionState.completed = true;
                    startBotBtn.disabled = false;
                    setStatus('✅ Selectie compleet! Start de bot.');
                    logSuccess('Alle markers zijn gezet');
                }
            }

            // ---- SLEEPFUNCTIE ----
            function makeDraggable(el) {
                let isDragging = false;
                let startX, startY, startLeftPct, startTopPct;

                const onStart = (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    const touch = e.touches ? e.touches[0] : null;
                    if (touch) {
                        startX = touch.clientX;
                        startY = touch.clientY;
                    } else {
                        startX = e.clientX;
                        startY = e.clientY;
                    }
                    const leftPct = parseFloat(el.style.left) || 0;
                    const topPct = parseFloat(el.style.top) || 0;
                    startLeftPct = leftPct;
                    startTopPct = topPct;
                    isDragging = true;
                    el.style.cursor = 'grabbing';
                    e.preventDefault();
                };

                const onMoveFn = (e) => {
                    if (!isDragging) return;
                    const touch = e.touches ? e.touches[0] : null;
                    let clientX, clientY;
                    if (touch) {
                        clientX = touch.clientX;
                        clientY = touch.clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;
                    let newLeftPct = startLeftPct + (dx / winW) * 100;
                    let newTopPct = startTopPct + (dy / winH) * 100;
                    newLeftPct = Math.max(0, Math.min(100, newLeftPct));
                    newTopPct = Math.max(0, Math.min(100, newTopPct));
                    
                    el.style.left = newLeftPct + '%';
                    el.style.top = newTopPct + '%';
                    
                    const id = el.id;
                    let pos = { x: newLeftPct, y: newTopPct };
                    switch(id) {
                        case 'marker-green': selectionState.serverListPos = pos; break;
                        case 'marker-orange': selectionState.backToServerListPos = pos; break;
                        case 'marker-red': selectionState.disconnectBtnPos = pos; break;
                        case 'marker-purple': selectionState.survivalItemPos = pos; break;
                    }
                    
                    checkCompletion();
                    e.preventDefault();
                };

                const onEnd = () => {
                    if (isDragging) {
                        isDragging = false;
                        el.style.cursor = 'grab';
                    }
                };

                el.addEventListener('mousedown', onStart);
                el.addEventListener('touchstart', onStart, { passive: false });
                document.addEventListener('mousemove', onMoveFn);
                document.addEventListener('touchmove', onMoveFn, { passive: false });
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchend', onEnd);
                el.style.cursor = 'grab';
            }

            makeDraggable(markerGreen);
            makeDraggable(markerOrange);
            makeDraggable(markerRed);
            makeDraggable(markerPurple);

            // ---- TESSERACT OCR FUNCTIES ----
            async function initOCR() {
                try {
                    logDebug('Tesseract.js initialiseren...');
                    ocrStatus.textContent = '🔍 OCR initialiseren...';
                    ocrStatus.classList.add('visible');
                    
                    ocrWorker = await Tesseract.createWorker('eng');
                    ocrReady = true;
                    
                    ocrStatus.textContent = '✅ OCR gereed';
                    setTimeout(() => ocrStatus.classList.remove('visible'), 2000);
                    logSuccess('Tesseract.js OCR geïnitialiseerd!');
                    return true;
                } catch (err) {
                    logError('OCR init fout: ' + err.message);
                    ocrStatus.classList.remove('visible');
                    return false;
                }
            }

            function getCanvas() {
                const frame = document.getElementById('game_frame');
                if (!frame) {
                    logError('Game frame niet gevonden!');
                    return null;
                }
                
                const canvas = frame.querySelector('canvas');
                if (!canvas) {
                    logError('Canvas niet gevonden in game frame!');
                    return null;
                }
                
                if (canvas.width === 0 || canvas.height === 0) {
                    logError(`Canvas heeft geen grootte: ${canvas.width}x${canvas.height}`);
                    return null;
                }
                
                return canvas;
            }

            function captureAndProcessCanvas(canvas) {
                try {
                    const offscreen = document.createElement('canvas');
                    offscreen.width = canvas.width;
                    offscreen.height = canvas.height;
                    const ctx = offscreen.getContext('2d', { willReadFrequently: true });
                    
                    if (!ctx) {
                        logError('Kan geen 2D context krijgen!');
                        return null;
                    }
                    
                    ctx.drawImage(canvas, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, offscreen.width, offscreen.height);
                    const data = imageData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                        if (brightness > 120) {
                            data[i] = Math.min(255, data[i] + 50);
                            data[i+1] = Math.min(255, data[i+1] + 50);
                            data[i+2] = Math.min(255, data[i+2] + 50);
                        } else {
                            data[i] = Math.max(0, data[i] - 40);
                            data[i+1] = Math.max(0, data[i+1] - 40);
                            data[i+2] = Math.max(0, data[i+2] - 40);
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    return offscreen.toDataURL('image/png');
                } catch (err) {
                    logError('Capture fout: ' + err.message);
                    return null;
                }
            }

            async function performOCR() {
                if (!ocrReady) {
                    logDebug('OCR niet gereed, probeer te initialiseren...');
                    await initOCR();
                    if (!ocrReady) {
                        logError('OCR nog steeds niet gereed');
                        return { found: false, confidence: 0, text: '', debug: 'OCR niet gereed' };
                    }
                }

                ocrCheckCount++;
                logOCR(`📖 OCR scan #${ocrCheckCount} gestart...`);
                ocrStatus.textContent = `🔍 OCR #${ocrCheckCount}...`;
                ocrStatus.classList.add('visible');

                try {
                    const canvas = getCanvas();
                    if (!canvas) {
                        ocrStatus.classList.remove('visible');
                        return { found: false, confidence: 0, text: '', debug: 'Geen canvas' };
                    }

                    const imageData = captureAndProcessCanvas(canvas);
                    if (!imageData) {
                        ocrStatus.classList.remove('visible');
                        return { found: false, confidence: 0, text: '', debug: 'Geen image data' };
                    }

                    logDebug('Tesseract aan het lezen...');
                    const startTime = Date.now();
                    const result = await ocrWorker.recognize(imageData);
                    const duration = ((Date.now() - startTime) / 1000).toFixed(2);
                    
                    const text = result.data.text || '';
                    const confidence = result.data.confidence || 0;
                    const words = result.data.words || [];
                    
                    logOCR(`OCR #${ocrCheckCount} voltooid in ${duration}s, ${words.length} woorden, confidence: ${confidence.toFixed(1)}%`);
                    
                    ocrStatus.classList.remove('visible');

                    const searchText = text.toLowerCase();
                    const targetPhrase = 'back to server list';
                    const found = searchText.includes(targetPhrase);
                    
                    if (found) {
                        logSuccess(`✅ "${targetPhrase}" gevonden! confidence: ${confidence.toFixed(1)}%`);
                        return {
                            found: true,
                            confidence: confidence,
                            text: text,
                            debug: `Gevonden met ${confidence.toFixed(1)}% confidence`
                        };
                    } else {
                        logDebug(`"${targetPhrase}" niet gevonden (confidence: ${confidence.toFixed(1)}%)`);
                        return {
                            found: false,
                            confidence: confidence,
                            text: text,
                            debug: 'Tekst niet gevonden'
                        };
                    }

                } catch (err) {
                    logError('OCR fout: ' + err.message);
                    ocrStatus.classList.remove('visible');
                    return { found: false, confidence: 0, text: '', debug: err.message };
                }
            }

            // ---- OCR CHECK FUNCTIE ----
            // Geeft TRUE terug als er een reset moet gebeuren (OCR positief)
            async function doOCRCheck(stepName) {
                logStep(`📖 OCR check voor "${stepName}"...`);
                const result = await performOCR();
                
                // Kijk of hij gevonden is EN confidence >= 50%
                if (result.found && result.confidence >= MIN_CONFIDENCE) {
                    logSuccess(`🎯 OCR geslaagd! confidence: ${result.confidence.toFixed(1)}% >= 50%`);
                    
                    // Klik op de "Back to server list" marker
                    const btsl = selectionState.backToServerListPos;
                    if (btsl) {
                        const pos = getPixelPos(btsl);
                        if (pos) {
                            logSuccess(`📐 Klik op Back to Server List marker (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)})`);
                            dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                            dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                            logDebug('⏳ Wacht 3s na klik...');
                            await sleep(3000);
                            logReset('🔄 OCR trigger! Herstart vanaf stap 1!');
                            return true; // TRUE = reset nodig
                        }
                    } else {
                        logError('❌ Back to Server List positie niet ingesteld!');
                        return false;
                    }
                } else {
                    const conf = result.confidence || 0;
                    if (result.found) {
                        logDebug(`⏭️ OCR gevonden maar confidence te laag: ${conf.toFixed(1)}% (min: 50%)`);
                    } else {
                        logDebug(`⏭️ OCR check gefaald (confidence: ${conf.toFixed(1)}%)`);
                    }
                    return false;
                }
                return false;
            }

            // ---- DISPATCH FUNCTIES ----
            function dispatchMouseEvent(type, x, y, button=0) {
                const canvas = document.querySelector('#game_frame canvas');
                if (!canvas) {
                    logError('Canvas niet gevonden voor mouse event!');
                    return;
                }
                try {
                    const rect = canvas.getBoundingClientRect();
                    const clampedX = Math.max(rect.left, Math.min(rect.right, x));
                    const clampedY = Math.max(rect.top, Math.min(rect.bottom, y));
                    
                    const ev = new MouseEvent(type, {
                        clientX: clampedX,
                        clientY: clampedY,
                        button: button,
                        bubbles: true,
                        cancelable: true,
                        view: window
                    });
                    canvas.dispatchEvent(ev);
                    logDebug(`Mouse ${type} op (${clampedX.toFixed(0)}, ${clampedY.toFixed(0)}) button=${button}`);
                } catch (err) {
                    logError('Mouse event fout: ' + err.message);
                }
            }

            function dispatchKeyEvent(type, key, code='') {
                try {
                    const ev = new KeyboardEvent(type, {
                        key: key,
                        code: code || key,
                        bubbles: true,
                        cancelable: true,
                        view: window
                    });
                    document.dispatchEvent(ev);
                    logDebug(`Key ${type}: ${key}`);
                } catch (err) {
                    logError('Key event fout: ' + err.message);
                }
            }

            function getPixelPos(sel) {
                if (!sel) return null;
                const rect = overlay.getBoundingClientRect();
                return {
                    x: rect.left + (sel.x / 100) * rect.width,
                    y: rect.top + (sel.y / 100) * rect.height
                };
            }

            async function typeString(text, delayBetween=50) {
                for (const char of text) {
                    if (botStopRequested) break;
                    let code = 'Key' + char.toUpperCase();
                    if (char === '/') code = 'Slash';
                    else if (char === ' ') code = 'Space';
                    else if (char === '.') code = 'Period';
                    else if (char === '@') code = 'Digit2';
                    else if (char === '#') code = 'Digit3';
                    else if (char === '!') code = 'Digit1';
                    else if (char === '?') code = 'Slash';
                    
                    dispatchKeyEvent('keydown', char, code);
                    dispatchKeyEvent('keyup', char, code);
                    await sleep(delayBetween);
                }
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            // ---- BOT LOOP ----
            async function botLoop() {
                if (botRunning) return;
                botRunning = true;
                botStopRequested = false;
                stopBotBtn.style.display = 'inline-block';
                startBotBtn.disabled = true;
                logSuccess(`🤖 Bot gestart (Tesseract OCR - min 50% confidence)`);
                let cycleCount = 0;
                let resetFromOCR = false;

                while (!botStopRequested) {
                    // Als we een reset hebben van OCR, begin dan opnieuw
                    if (resetFromOCR) {
                        logReset('🔄 Reset door OCR trigger, begin opnieuw vanaf stap 1');
                        resetFromOCR = false;
                        // Ga naar de volgende iteratie om opnieuw te beginnen
                        continue;
                    }
                    
                    cycleCount++;
                    ocrCheckCount = 0;
                    log(`🔄 === CYCLE ${cycleCount} START ===`, 'debug');
                    
                    try {
                        // === STAP 0: PRE-OCR CHECK ===
                        const shouldReset = await doOCRCheck('Start cyclus');
                        if (shouldReset) {
                            resetFromOCR = true;
                            continue;
                        }

                        // === STAP 1: Dubbelklik op server list ===
                        logStep('📍 STAP 1: Dubbelklik op server list');
                        const reset1 = await doOCRCheck('Voor dubbelklik');
                        if (reset1) { resetFromOCR = true; continue; }
                        
                        const sl = selectionState.serverListPos;
                        if (sl) {
                            const pos = getPixelPos(sl);
                            if (pos) {
                                log(`📡 Dubbelklik op server list (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)})`);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                                await sleep(150);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                            }
                        } else {
                            logError('❌ Server list positie niet ingesteld!');
                            break;
                        }
                        
                        const reset2 = await doOCRCheck('Na dubbelklik');
                        if (reset2) { resetFromOCR = true; continue; }
                        
                        // === STAP 2: Wacht 10-15 seconden ===
                        const wait1 = 10000 + Math.floor(Math.random() * 5000);
                        logFarming(`⏳ Wacht ${(wait1/1000).toFixed(0)}s na dubbelklik...`);
                        for (let i = 0; i < Math.floor(wait1 / 1000); i++) {
                            if (botStopRequested) break;
                            if (i % 5 === 0) {
                                const resetW = await doOCRCheck(`Wacht ${i}s`);
                                if (resetW) { resetFromOCR = true; break; }
                            }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;

                        // === STAP 3: T indrukken ===
                        logStep('📍 STAP 2: T indrukken');
                        const reset3 = await doOCRCheck('Voor T');
                        if (reset3) { resetFromOCR = true; continue; }
                        dispatchKeyEvent('keydown', 't', 'KeyT');
                        dispatchKeyEvent('keyup', 't', 'KeyT');
                        log('⌨️ T ingedrukt');
                        const reset4 = await doOCRCheck('Na T');
                        if (reset4) { resetFromOCR = true; continue; }
                        
                        // === STAP 4: Wacht 5 seconden ===
                        logFarming('⏳ Wacht 5s na T...');
                        for (let i = 0; i < 5; i++) {
                            if (botStopRequested) break;
                            const resetW = await doOCRCheck(`Wacht ${i+1}/5s`);
                            if (resetW) { resetFromOCR = true; break; }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;

                        // === STAP 5: Type /login + wachtwoord ===
                        logStep('📍 STAP 3: Typen /login');
                        const reset5 = await doOCRCheck('Voor typen');
                        if (reset5) { resetFromOCR = true; continue; }
                        const pass = passInput.value || '<pass>';
                        const cmd = '/login ' + pass;
                        log(`⌨️ Typen: ${cmd}`);
                        await typeString(cmd, 30);
                        await sleep(500);
                        const reset6 = await doOCRCheck('Na typen');
                        if (reset6) { resetFromOCR = true; continue; }

                        // === STAP 6: Enter ===
                        logStep('📍 STAP 4: Enter');
                        const reset7 = await doOCRCheck('Voor Enter');
                        if (reset7) { resetFromOCR = true; continue; }
                        dispatchKeyEvent('keydown', 'Enter', 'Enter');
                        dispatchKeyEvent('keyup', 'Enter', 'Enter');
                        log('⏎ Enter');
                        const reset8 = await doOCRCheck('Na Enter');
                        if (reset8) { resetFromOCR = true; continue; }
                        
                        // === STAP 7: Wacht 30 seconden ===
                        logFarming('⏳ Wacht 30s tot login...');
                        for (let i = 0; i < 30; i++) {
                            if (botStopRequested) break;
                            if (i % 5 === 0) {
                                const resetW = await doOCRCheck(`Login wacht ${i}s`);
                                if (resetW) { resetFromOCR = true; break; }
                            }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;

                        // === STAP 8: Rechtsklik op survival item ===
                        logStep('📍 STAP 5: Rechtsklik op survival item');
                        const reset9 = await doOCRCheck('Voor rechtsklik');
                        if (reset9) { resetFromOCR = true; continue; }
                        const si = selectionState.survivalItemPos;
                        if (si) {
                            const pos = getPixelPos(si);
                            if (pos) {
                                log(`🖱️ Rechtsklik op survival item (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)})`);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 2);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 2);
                            }
                        } else {
                            logError('❌ Survival item positie niet ingesteld!');
                            break;
                        }
                        const reset10 = await doOCRCheck('Na rechtsklik');
                        if (reset10) { resetFromOCR = true; continue; }
                        
                        // === STAP 9: Wacht 5 seconden ===
                        logFarming('⏳ Wacht 5s na rechtsklik...');
                        for (let i = 0; i < 5; i++) {
                            if (botStopRequested) break;
                            const resetW = await doOCRCheck(`Wacht ${i+1}/5s na rechtsklik`);
                            if (resetW) { resetFromOCR = true; break; }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;
                        
                        // === STAP 10: Linksklik op survival item ===
                        logStep('📍 STAP 6: Linksklik op survival item');
                        const reset11 = await doOCRCheck('Voor linksklik');
                        if (reset11) { resetFromOCR = true; continue; }
                        if (si) {
                            const pos = getPixelPos(si);
                            if (pos) {
                                log(`🖱️ Linksklik op survival item (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)})`);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                            }
                        }
                        const reset12 = await doOCRCheck('Na linksklik');
                        if (reset12) { resetFromOCR = true; continue; }
                        
                        // === STAP 11: FARMEN - 15 MINUTEN ===
                        logStep('📍 STAP 7: FARMEN - 15 minuten');
                        farmingProgress.classList.add('visible');
                        
                        for (let minute = 0; minute < 15; minute++) {
                            if (botStopRequested) break;
                            const remaining = 15 - minute;
                            farmingProgress.textContent = `⏳ Farming ${minute+1}/15 min (${remaining} min rest)`;
                            logFarming(`⏳ Farming minuut ${minute+1}/15...`);
                            
                            const resetF = await doOCRCheck(`Farming minuut ${minute+1}`);
                            if (resetF) { resetFromOCR = true; break; }
                            
                            for (let sec = 0; sec < 60; sec += 15) {
                                if (botStopRequested) break;
                                if (sec > 0) {
                                    const resetFS = await doOCRCheck(`Farming ${minute+1}:${sec}s`);
                                    if (resetFS) { resetFromOCR = true; break; }
                                }
                                await sleep(15000);
                            }
                            if (resetFromOCR) break;
                        }
                        
                        farmingProgress.classList.remove('visible');
                        if (resetFromOCR) continue;
                        
                        logSuccess(`✅ Farming voltooid!`);
                        const reset13 = await doOCRCheck('Na farming');
                        if (reset13) { resetFromOCR = true; continue; }
                        
                        // === STAP 12: Escape ===
                        logStep('📍 STAP 8: Escape');
                        const reset14 = await doOCRCheck('Voor Escape');
                        if (reset14) { resetFromOCR = true; continue; }
                        dispatchKeyEvent('keydown', 'Escape', 'Escape');
                        dispatchKeyEvent('keyup', 'Escape', 'Escape');
                        log('⎋ Escape');
                        const reset15 = await doOCRCheck('Na Escape');
                        if (reset15) { resetFromOCR = true; continue; }
                        
                        // === STAP 13: Wacht 5 seconden ===
                        logFarming('⏳ Wacht 5s na Escape...');
                        for (let i = 0; i < 5; i++) {
                            if (botStopRequested) break;
                            const resetW = await doOCRCheck(`Wacht ${i+1}/5s na Escape`);
                            if (resetW) { resetFromOCR = true; break; }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;
                        
                        // === STAP 14: Disconnect ===
                        logStep('📍 STAP 9: Disconnect');
                        // GEEN OCR VOOR DISCONNECT - direct klikken op de marker
                        const db = selectionState.disconnectBtnPos;
                        if (db) {
                            const pos = getPixelPos(db);
                            if (pos) {
                                log(`🔴 Disconnect op marker (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)})`);
                                dispatchMouseEvent('mousedown', pos.x, pos.y, 0);
                                dispatchMouseEvent('mouseup', pos.x, pos.y, 0);
                            }
                        } else {
                            logError('❌ Disconnect knop positie niet ingesteld!');
                            break;
                        }
                        
                        // === STAP 15: Wacht 10 seconden ===
                        logFarming('⏳ Wacht 10s voor volgende cyclus...');
                        for (let i = 0; i < 10; i++) {
                            if (botStopRequested) break;
                            if (i % 3 === 0) {
                                const resetW = await doOCRCheck(`Wacht ${i}s voor volgende cyclus`);
                                if (resetW) { resetFromOCR = true; break; }
                            }
                            await sleep(1000);
                        }
                        if (resetFromOCR) continue;

                        // GEEN OCR CHECK NA DISCONNECT - direct terug naar stap 1
                        logSuccess(`🔄 === CYCLE ${cycleCount} VOLTOOID, ga terug naar stap 1 ===`);
                        
                    } catch (err) {
                        logError('Fout in bot loop: ' + err.message);
                        logDebug('⏳ Wacht 5s voor herstart...');
                        await sleep(5000);
                    }
                }

                botRunning = false;
                stopBotBtn.style.display = 'none';
                startBotBtn.disabled = false;
                farmingProgress.classList.remove('visible');
                ocrStatus.classList.remove('visible');
                logSuccess(`⏹ Bot gestopt na ${cycleCount} cycles`);
            }

            // ---- EVENT LISTENERS ----
            startSelectieBtn.addEventListener('click', startSelection);

            popupSelect.addEventListener('click', () => {
                if (!isSelecting) return;
                hidePopup();
                waitingForClick = true;
                setStatus(`👆 Klik op het scherm (stap ${currentStep})`);
                overlay.classList.add('active');
                logDebug(`Wachten op klik voor stap ${currentStep}`);
            });

            popupSkip.addEventListener('click', () => {
                if (!isSelecting) return;
                skipStep(currentStep);
            });

            popupCancel.addEventListener('click', () => {
                if (!isSelecting) return;
                hidePopup();
                waitingForClick = false;
                setStatus('❌ Selectie geannuleerd');
                hideAllMarkers();
                overlay.classList.remove('active');
                startBotBtn.disabled = true;
                log('❌ Selectie geannuleerd');
            });

            overlay.addEventListener('click', handleCanvasClick);
            overlay.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if (!touch) return;
                const me = new MouseEvent('click', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                });
                handleCanvasClick(me);
            }, { passive: true });

            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('ui-hidden');
            });

            startBotBtn.addEventListener('click', async () => {
                if (!selectionState.completed) {
                    logError('⚠️ Selecteer eerst alle stappen');
                    return;
                }
                if (botRunning) return;
                
                if (!ocrReady) {
                    logDebug('OCR initialiseren...');
                    await initOCR();
                }
                
                botLoop();
            });

            stopBotBtn.addEventListener('click', () => {
                botStopRequested = true;
                log('⏳ Stop aangevraagd...');
            });

            // ---- TEST OCR ----
            function testOCR() {
                logDebug('📖 Handmatige OCR test...');
                performOCR().then(result => {
                    if (result.found) {
                        logSuccess(`OCR test: "${result.text.substring(0, 50)}..." confidence: ${result.confidence.toFixed(1)}%`);
                    } else {
                        logDebug(`OCR test: geen resultaat (${result.debug})`);
                    }
                });
            }

            // ---- INIT ----
            checkCompletion();
            log('🟢 BClient geladen met Tesseract.js OCR');
            log(`🎯 Min confidence: ${MIN_CONFIDENCE}%`);
            log(`📍 4 markers: Server List | Back to Server List | Disconnect | Survival Item`);
            log(`🔄 Bij OCR trigger: klik op Back to Server List → reset naar stap 1`);
            setStatus('🔹 Klik op "Start Selectie" of sleep markers');
            
            setTimeout(() => {
                initOCR();
            }, 3000);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'o' || e.key === 'O') {
                    logDebug('🔍 Handmatige OCR test...');
                    testOCR();
                }
            });
            logDebug('💡 Druk op "O" voor handmatige OCR test');
            
            setTimeout(() => {
                const canvas = document.querySelector('#game_frame canvas');
                if (canvas) {
                    logDebug(`Canvas gevonden: ${canvas.width}x${canvas.height}`);
                } else {
                    logDebug('Canvas nog niet gevonden, wacht...');
                }
            }, 5000);
        })();
    </script>

</body>
</html>
